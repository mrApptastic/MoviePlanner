name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MoviePlanner/MoviePlanner.csproj

      - name: Run tests
        run: dotnet test tests/MoviePlanner.Tests/MoviePlanner.Tests.csproj --no-restore --verbosity normal

      - name: Publish
        run: dotnet publish src/MoviePlanner/MoviePlanner.csproj -c Release -o release

      - name: Change base href
        run: sed -i 's|<base href="/" />|<base href="/MoviePlanner/" />|g' release/wwwroot/index.html

      - name: Update service worker base path
        run: sed -i 's|const base = "/";|const base = "/MoviePlanner/";|g' release/wwwroot/service-worker.published.js

      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Copy index.html to 404.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
